[package]
name = "crucible-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HTTP issuer + verify endpoints for Crucible challenges. Mountable axum::Router for embedding under /crucible/* on any host site."

[dependencies]
crucible-core = { workspace = true }
crucible-challenges = { workspace = true }
crucible-corpus = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# axum's test-host harness — drives router routes in-memory
# without binding a TCP socket. Keeps the suite hermetic.
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
